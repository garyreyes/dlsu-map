# The one required check. Branch protection requires the job named "gates", so the job must always run and always
# report. Only the expensive steps inside it are conditional. Never add `paths-ignore` to `on:`: a required check
# that never posts blocks every merge. See docs/DECISIONS.md D22.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.changes.outputs.code }}
    env:
      DO_NOT_TRACK: '1'
      IMPECCABLE_NO_TELEMETRY: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # "Code" = any changed file that is not a .md file and not under docs/. CI config, package.json and lockfiles
      # count as code on purpose: they change what the gates check.
      - name: Detect what changed
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if files=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null); then
            echo "Changed files:"
            echo "$files"
          else
            echo "No usable base commit, so this counts as a code change."
            files="(unknown)"
          fi
          if printf '%s\n' "$files" | grep -vE '\.md$|^docs/' | grep -q .; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # Runs on every PR: it takes seconds and is the only gate until app code exists.
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

      - name: Note skipped app gates
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') == ''
        run: echo "::notice::No package-lock.json yet, so lint, typecheck, test and build were skipped."

      # App gates. package.json must define lint, typecheck, test and build (CLAUDE.md, "Gates").
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Check dependency tree (fails on peer-dependency conflicts)
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm ls --all > /dev/null

      - name: Lint
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm run lint

      # D1: two TypeScript packages are installed side by side. Fail unless type-checking really runs on tsc 7.
      - name: Check type-checker is TypeScript 7
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: |
          version=$(node node_modules/@typescript/native/bin/tsc --version)
          echo "$version"
          case "$version" in "Version 7."*) ;; *) echo "::error::Expected tsc 7.x, got: $version"; exit 1 ;; esac

      - name: Type-check
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm test

      # Includes the data compiler, whose constraints (ARCHITECTURE §3.4) fail the build.
      - name: Build
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm run build
        # The ⓘ sheet's version: the PR's own commit, not the merge commit a PR checkout builds (10b).
        env:
          APP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      # 1b: headers, robots.txt and "nothing loads from another site", against wrangler dev serving dist/ the way
      # Cloudflare does. Needs no secrets, so it runs on Dependabot and fork PRs too.
      - name: Install Playwright browser
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        if: steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm run e2e

      # Deterministic design-slop rules (Impeccable). Exit 2 = findings, which fails the job.
      - name: Design detector
        if: >-
          steps.changes.outputs.code == 'true' && hashFiles('package-lock.json') != '' &&
          hashFiles('src/**/*.tsx', 'src/**/*.css', 'index.html') != ''
        run: |
          targets=(src)
          if [ -f index.html ]; then targets+=(index.html); fi
          npx --yes impeccable@4.6.0 detect "${targets[@]}"

  # A preview link per PR (D5, D28): https://pr-<number>-dlsu-map.<account>.workers.dev. Not a required check. It
  # never deploys to production: `versions upload` only makes a preview, and wrangler.jsonc keeps workers_dev off.
  # Only same-repo PRs get the secrets (GitHub withholds them from forks and Dependabot), so other PRs skip it.
  preview:
    name: preview
    needs: gates
    if: >-
      github.event_name == 'pull_request' && needs.gates.outputs.code == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # The ⓘ sheet's version: the PR's own commit, not the merge commit a PR checkout builds (10b).
        env:
          APP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      # The token is only in this step's environment. Only the PR number reaches the shell, never a title or a branch
      # name, so nothing a PR author types can be run as a command.
      - name: Upload preview
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets on this run, so no preview link."
            exit 0
          fi
          if ! out=$(npx wrangler versions upload --preview-alias "$ALIAS" --message "$ALIAS" 2>&1); then
            echo "$out"
            exit 1
          fi
          echo "$out"
          url=$(printf '%s\n' "$out" | grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview alias URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited on every push, so the thread doesn't fill up with links.
      - name: Post the link on the PR
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '**Preview:** %s\n\nBuilt from %s. Beta, `noindex`: share it with testers only (D19).' \
            "$URL" "${SHA:0:7}")
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
